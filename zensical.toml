[project]
site_name = "Books"
site_url = "https://vivekkpatel.github.io/Books/"
use_directory_urls = false
repo_name = "Books"
repo_url = "https://github.com/vivekkpatel/Books"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2025 Nodes Automations"

[project.extra]
generator = false

[project.theme]
variant = "modern"
logo = "assets/favicon.png"
favicon = "assets/favicon.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.path",
  "navigation.tabs",
  "navigation.indexes",
]
palette = [
  { scheme = "slate", primary = "black", accent = "indigo", toggle = { icon = "material/brightness-4", name = "Switch to light mode" } },
  { scheme = "default", primary = "indigo", accent = "indigo", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } },
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.awesome-nav]

[project.markdown_extensions]
admonition = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.arithmatex.generic = true
def_list = {}
pymdownx.tasklist.custom_checkbox = true
